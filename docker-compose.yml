version: "3.9"

services:
  web:
    build:
      context: ./backend
      dockerfile: Dockerfile
    image: patients-api:latest
    container_name: patients-api
    ports:
      - "8000:8000"
    environment:
      DJANGO_DEBUG: "1"
      DJANGO_ALLOWED_HOSTS: "*"
      MONGODB_DB_NAME: "patientdb"
      MONGODB_URI: "${MONGODB_URI}"
    restart: unless-stopped
